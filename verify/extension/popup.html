<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; color: #1C1C28; background: #F7F4EE; }
  .head { padding: 12px 14px; color: #fff; }
  .VERIFIED { background: #1F5E3B; } .MISMATCH { background: #B33A3A; } .UNATTESTED { background: #8A6D3B; } .NONE { background: #555; }
  .head b { display: block; font-size: 15px; }
  .body { padding: 12px 14px; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-all; color: #555; }
  ul { margin: 6px 0 0 16px; padding: 0; } li { margin: 2px 0; }
  .err { color: #8E2323; } .warn { color: #6B5320; }
  section { border-top: 1px solid #E6E2DA; padding-top: 10px; margin-top: 10px; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid #ccc; border-radius: 3px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #0C0E14; background: #0C0E14; color: #fff; border-radius: 3px; cursor: pointer; }
  button.ghost { background: transparent; color: #0C0E14; }
  .muted { color: #7A7A8E; font-size: 12px; }
</style>
</head>
<body>
  <div id="head" class="head NONE"><b id="status">Not a Kovel page</b><span id="sub"></span></div>
  <div class="body">
    <div id="detail"></div>
    <section id="note" hidden>
      <div><strong>Latest change to this build</strong></div>
      <div id="noteTitle"></div>
      <div id="noteFiles" class="mono"></div>
    </section>
    <section id="keyholder" hidden>
      <div><strong>Keyholder</strong> <span class="muted">— your passphrase stays here, never typed into the page</span></div>
      <div id="khState" class="muted"></div>
      <textarea id="pass" rows="2" placeholder="nine words, separated by spaces" autocomplete="off" spellcheck="false"></textarea>
      <div style="margin-top:6px; display:flex; gap:6px">
        <button id="store">Store for this matter</button>
        <button id="forget" class="ghost">Forget</button>
      </div>
    </section>
    <section>
      <label><input type="radio" name="policy" value="block"> Refuse to release my passphrase unless the build is verified</label>
      <label><input type="radio" name="policy" value="warn"> Warn me, and let me decide each time</label>
      <div style="margin-top:8px; display:flex; gap:6px; align-items:center">
        <button id="recheck" class="ghost">Re-check this page</button>
        <a id="options" href="#" class="muted">Settings</a>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
